# Builds the app on every push and pull request. Pushing a tag like v0.1 also publishes
# a GitHub release with the zipped app attached.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          case "$GITHUB_REF" in refs/tags/v*) export VERSION="${GITHUB_REF_NAME#v}" ;; esac
          ./build.sh --no-install
          ditto -c -k --keepParent "build/Lumikey.app" Lumikey.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lumikey
          path: Lumikey.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv Lumikey.zip "Lumikey-$GITHUB_REF_NAME.zip"
          gh release create "$GITHUB_REF_NAME" "Lumikey-$GITHUB_REF_NAME.zip" \
            --title "Lumikey ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
